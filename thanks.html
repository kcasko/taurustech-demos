<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request Received - TaurusTech</title>
  <link rel="stylesheet" href="/assets/css/showroom.css" />
  <style>
    .thanks-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .thanks-card {
      max-width: 480px;
      padding: 40px 32px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(12,16,32,.8), rgba(20,24,48,.6));
      position: relative;
      overflow: hidden;
    }

    .thanks-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(124,77,255,.5), rgba(0,229,255,.5), transparent);
    }

    .check-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(34,197,94,.2), rgba(0,229,255,.15));
      border: 2px solid var(--success);
      font-size: 32px;
      color: var(--success);
      margin-bottom: 24px;
      animation: popIn 0.5s ease;
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .thanks-card h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    .thanks-card p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
    }

    .thanks-card .cta {
      margin-top: 8px;
    }

    .brand-mini {
      margin-top: 32px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .brand-mini .logo {
      width: 32px;
      height: 32px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="thanks-page">
    <div class="thanks-card">
      <div class="check-icon">✓</div>
      <h1>Demo request received!</h1>
      <p>
        Thanks for reaching out. I'll review your business details and 
        get back to you soon with a custom demo showing how your 
        website could work.
      </p>
      <a class="cta" href="/">
        <span class="btn-text">Back to showroom</span>
        <span class="btn-icon">→</span>
      </a>
    </div>

    <div class="brand-mini">
      <div class="logo">TT</div>
      <span>TaurusTech</span>
    </div>
  </div>

</body>
</html>
